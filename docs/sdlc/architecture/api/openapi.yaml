          format: date-time
      required:
      - id
      - email
      - password_hash
      - created_at
    books:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        author:
          type: string
        total_copies:
          type: integer
        available_copies:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
      - id
      - title
      - author
      - total_copies
      - available_copies
      - created_at
      - updated_at
    loans:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
